# Configuration for Breast Tumor Segmentation
# UNet++ with EfficientNet-B0 backbone (lighter model)

experiment:
  name: "breast_tumor_unet++"
  output_dir: "./experiments/breast_tumor"
  seed: 42
  fold: 0

data:
  name: "breast"
  data_dir: "./data/breast"
  
  image_size: [512, 512]
  in_channels: 3
  num_classes: 3  # Background, benign, malignant
  
  augmentation:
    enabled: true
    train:
      - name: "RandomResizedCrop"
        params:
          height: 512
          width: 512
          scale: [0.8, 1.0]
      - name: "HorizontalFlip"
        params:
          p: 0.5
      - name: "VerticalFlip"
        params:
          p: 0.5
      - name: "RandomRotate90"
        params:
          p: 0.5
      - name: "ShiftScaleRotate"
        params:
          shift_limit: 0.1
          scale_limit: 0.1
          rotate_limit: 20
          p: 0.5
      - name: "RandomBrightnessContrast"
        params:
          brightness_limit: 0.2
          contrast_limit: 0.2
          p: 0.5
      - name: "HueSaturationValue"
        params:
          hue_shift_limit: 15
          sat_shift_limit: 20
          val_shift_limit: 10
          p: 0.5
      - name: "ElasticTransform"
        params:
          alpha: 1
          sigma: 50
          alpha_affine: 50
          p: 0.3
      - name: "Normalize"
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    
    valid:
      - name: "Resize"
        params:
          height: 512
          width: 512
      - name: "Normalize"
        params:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
  
  batch_size: 16
  num_workers: 4
  pin_memory: true

model:
  name: "unet++"
  encoder_name: "efficientnet-b0"
  encoder_pretrained: true
  decoder_channels: [256, 128, 64, 32]
  dropout: 0.3
  deep_supervision: false

training:
  epochs: 150
  accumulate_grad_batches: 2
  
  optimizer:
    name: "AdamW"
    lr: 5.0e-4
    weight_decay: 1.0e-5
  
  scheduler:
    name: "CosineAnnealingLR"
    T_max: 150
    eta_min: 1.0e-6
  
  loss:
    name: "combined"
    dice_weight: 0.6
    ce_weight: 0.4
    focal_weight: 0.0
  
  metrics:
    - "dice"
    - "iou"
    - "sensitivity"
    - "specificity"
  
  early_stopping:
    enabled: true
    patience: 20
    monitor: "valid_dice"
    mode: "max"
  
  checkpoint:
    save_top_k: 3
    monitor: "valid_dice"
    mode: "max"
  
  mixed_precision: true
  gradient_clip_val: 1.0

inference:
  patch_size: 512
  overlap: 0.5
  batch_size: 8
  tta: true
  threshold: 0.5

logging:
  log_dir: "./logs"
  log_interval: 10
  tensorboard: true
  wandb:
    enabled: false
    project: "histocore-ml-breast"
