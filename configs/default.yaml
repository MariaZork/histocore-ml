# Default WSI segmentation — inference at 10× magnification
# TorchScript model, tiled with 50% overlap, written as pyramidal TIFF

experiment:
  name: "default_segmentation"
  output_dir: "./outputs"
  seed: 42

data:
  # Tiling geometry
  patch_size: 512
  patch_overlap: 0.5      # 256 px of 512
  target_mpp: 0.88        # 10× magnification
  in_channels: 3

  # Tissue filtering (background/black value thresholds)
  tissue_threshold: 0.05  # Minimum foreground fraction
  background_value: 230   # White background threshold
  black_value: 10         # Black background threshold

  # Dataloader settings
  num_workers: 4
  prefetch_factor: 2

model:
  # checkpoint is the only field a TorchScript (.pt) or ONNX model needs — it
  # carries its own graph. name/encoder_name are used solely to rebuild the
  # network when checkpoint points at a training .pth state dict, so change
  # them to match if you swap one in.
  name: "unet"
  encoder_name: "resnet50"
  checkpoint: "models/model_scripted.pt"

inference:
  patch_size: 512
  batch_size: 8
  threshold: 0.5
  device: "cpu"

  # Output settings
  output_dir: "./outputs"
  output_format: "tiff"
  compression: "lzw"
  downsample_factor: null
  save_thumbnail: true
  save_overlay: true
  overlay_alpha: 0.40
  overlay_max_edge: 2048

logging:
  level: "INFO"
  log_dir: "./logs"
