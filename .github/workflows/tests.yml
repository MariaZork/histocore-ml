name: 🧪 Tests

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 💾 Cache pip packages (Unix)
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 💾 Cache pip packages (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 🏗️ Install OpenSlide (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y openslide-tools libopenslide-dev

    - name: 🏗️ Install OpenSlide (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install openslide

    - name: 🏗️ Install OpenSlide (Windows)
      if: runner.os == 'Windows'
      run: |
        # Download and install OpenSlide for Windows
        $openslideUrl = "https://github.com/openslide/openslide-winbuild/releases/download/v20231011/openslide-win64-20231011.zip"
        Invoke-WebRequest -Uri $openslideUrl -OutFile openslide.zip
        Expand-Archive -Path openslide.zip -DestinationPath C:\openslide
        echo "C:\openslide\openslide-win64-20231011\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,biomarkers]"

    - name: 🧪 Run tests
      run: |
        pytest tests/ -v --tb=short --cov=histocoreml --cov-report=xml --cov-report=term

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: 🔍 Lint with ruff
      run: |
        ruff check histocoreml/ tests/

    - name: 📝 Type check with mypy
      run: |
        mypy histocoreml/ --ignore-missing-imports

  test-gpu:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'gpu-test')

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🏗️ Install OpenSlide
      run: |
        sudo apt-get update
        sudo apt-get install -y openslide-tools libopenslide-dev

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cu118
        pip install -e ".[dev,biomarkers]"

    - name: 🧪 Run GPU tests
      run: |
        pytest tests/ -v -m gpu --tb=short

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 🏗️ Install OpenSlide
      run: |
        sudo apt-get update
        sudo apt-get install -y openslide-tools libopenslide-dev

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,biomarkers]"
        pip install pytest-benchmark

    - name: 📊 Run benchmarks
      run: |
        pytest tests/ -v --benchmark-only --benchmark-json=output.json

    - name: 📤 Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: output.json