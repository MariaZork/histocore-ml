[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "histocoreml"
version = "0.1.0"
description = "Production-ready ML framework for computational histology: WSI segmentation, foundation models, biomarker extraction, and training utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
authors = [
    { name = "Maria Zorkaltseva", email = "maria.zorkaltseva@gmail.com" },
]
keywords = ["histology", "pathology", "wsi", "segmentation", "foundation-models", "biomarkers", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "tifffile>=2023.1.0",
    "zarr>=2.18.3",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "opencv-python-headless>=4.7.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
openslide = [
    "openslide-python>=1.3.0",
]
foundation = [
    "transformers>=4.35.0",
    "timm>=0.9.0",
    "huggingface-hub>=0.19.0",
    "einops>=0.7.0",
]
training = [
    "albumentations>=1.3.0",
    "monai>=1.3.0",
    "torch>=2.0.0", 
    "torchvision>=0.15.0", 
    "timm>=0.9.0", 
    "wandb>=0.15.0",
    "lightning>=2.1.0",
    "mlflow>=2.8.0",
    "tensorboard>=2.14.0",
]
biomarkers = [
    "scikit-image>=0.21.0",
    "shapely>=2.0.0",
    "geojson>=3.0.0",
]
cloud = [
    "boto3>=1.26.0",
    "google-cloud-storage>=2.0.0",
    "azure-storage-blob>=12.0.0",
]
kubeflow = [
    "kfp>=2.0.0",
]
onnx = ["onnxruntime>=1.15.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML",
    "types-tqdm",
    "black>=23.0.0",
    "pre-commit>=3.4.0",
]
docs = ["mkdocs>=1.5.0", "mkdocs-material>=9.0.0", "mkdocstrings>=0.23.0"]
all = [
    "histocoreml[openslide,foundation,training,biomarkers,cloud]",
]

[project.scripts]
histo-segment  = "histocoreml.cli:main_segment"
histo-train    = "histocoreml.cli:main_train"
histo-extract  = "histocoreml.cli:main_extract"
histo-embed    = "histocoreml.cli:main_embed"

[project.urls]
Homepage      = "https://github.com/histocoreml/histocoreml"
Documentation = "https://histocoreml.readthedocs.io"
Issues        = "https://github.com/histocoreml/histocoreml/issues"

[tool.hatch.build.targets.wheel]
packages = ["histocoreml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
force-exclude = '\.ipynb'

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "*.ipynb",
    ".git",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "N", "I", "B", "UP", "ANN", "BLE", "C4", "PLC"]
ignore = ["ANN401"]
per-file-ignores = {"tests/**/*.py" = ["ANN", "PLC0415"]}

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
allow_redefinition = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "gpu: requires a CUDA-capable GPU",
    "foundation: requires foundation model weights",
    "integration: marks tests as integration tests (run separately with '-m integration')",
]

[tool.coverage.run]
source = ["histocoreml"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]